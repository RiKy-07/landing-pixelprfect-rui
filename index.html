<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./public/css/styles.css" />
    <title>Positivus</title>
  </head>
  <body>
    <section class="hero-section">
      <main>
        <div class="header_wrapper">
          <header>
            <div class="logo_wrapper">
              <img
                src="/public/assets/svgs/Logo.svg"
                alt="Positivus's logotype"
              />
            </div>
            <div class="nav_wrapper">
              <div class="nav_container_list">
                <nav>
                  <ul>
                    <li><a href="">About Us</a></li>
                    <li><a href="">Services</a></li>
                    <li><a href="">Use Cases</a></li>
                    <li><a href="">Pricing</a></li>
                    <li><a href="">Blog</a></li>
                  </ul>
                </nav>
              </div>
              <div class="nav_container_button">
                <button class="btn btn_white">Request a Quote</button>
              </div>
            </div>
          </header>
        </div>

        <div class="hero_content">
          <div class="hero_text">
            <h1 class="hero_title">
              Navigating the <br />
              digital landscape<br />
              for success
            </h1>
            <p>
              Our digital marketing agency helps businesses<br />
              grow and succeed online through a range of<br />
              services including SEO, PPC, social media<br />
              marketing, and content creation.
            </p>
            <button class="btn btn_dark">Book a consultation</button>
          </div>

          <div class="hero_illustration">
            <img src="/public/assets/svgs/Illustration.svg" alt="" />
          </div>
        </div>

        <div class="companies-logos">
          <img src="/public/assets/svgs/companies/amazon_logo.svg" alt="" />
          <img src="/public/assets/svgs/companies/dribbble_logo.svg" alt="" />
          <img src="/public/assets/svgs/companies/hubspot_logo.svg" alt="" />
          <img src="/public/assets/svgs/companies/notion_logo.svg" alt="" />
          <img src="/public/assets/svgs/companies/netflix_logo.svg" alt="" />
          <img src="/public/assets/svgs/companies/zoom_logo.svg" alt="" />
        </div>
      </main>
    </section>
  </body>
</html>
